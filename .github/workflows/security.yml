name: Dependency security

on:
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `pnpm audit` is the built-in command and ignores the thresholds; the
      # script name has to be spelled out for `--prod --audit-level high`.
      - run: pnpm run audit
