name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Style architecture
        run: pnpm lint:styles

      - name: Markdown plugins
        run: pnpm test:markdown

      - name: Unit tests
        run: pnpm test:unit

      - name: Type check
        run: pnpm astro check

      - name: Build
        run: pnpm build

      - name: Generated HTML check
        run: pnpm test:html

      - name: Link check
        run: pnpm test:links

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser regression tests
        run: pnpm test:browser

      - name: Save validated site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: validated-site
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-report
          path: playwright-report/

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
